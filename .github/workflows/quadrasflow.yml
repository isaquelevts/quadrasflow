name: QuadrasFlow CI and production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quadrasflow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/isaquelevts/quadrasflow-api:${{ github.sha }}
            ghcr.io/isaquelevts/quadrasflow-api:main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: API_UPSTREAM=quadrasflow-cutover-api
          tags: |
            ghcr.io/isaquelevts/quadrasflow-web:${{ github.sha }}
            ghcr.io/isaquelevts/quadrasflow-web:main

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Publish to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/quadrasflow_deploy"
          chmod 600 "$HOME/.ssh/quadrasflow_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/quadrasflow_deploy" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' -- "${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail
          release_dir=/opt/quadrasflow/github-release
          repo=https://github.com/isaquelevts/quadrasflow.git
          if [ ! -d "$release_dir/.git" ]; then
            install -d -m 755 "$(dirname "$release_dir")"
            git clone --branch main --single-branch "$repo" "$release_dir"
          fi
          actual_repo=$(git -C "$release_dir" remote get-url origin)
          if [ "$actual_repo" != "$repo" ]; then
            echo "Unexpected origin in release checkout; stopping." >&2
            exit 1
          fi
          git -C "$release_dir" fetch --prune origin main
          git -C "$release_dir" checkout --detach "$1"
          QUADRASFLOW_RELEASE_TAG="$1" bash "$release_dir/deploy/production-deploy.sh" \
            "$release_dir" /opt/quadrasflow/secrets
          REMOTE
